<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Circle Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <!-- Light Bulb Filament & Glow Gradient -->
    <radialGradient id="bulbGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>

  <!-- Light Rays Emanating from Bulb -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="6" x2="32" y2="10" />
    <line x1="14" y1="14" x2="17.5" y2="17.5" />
    <line x1="50" y1="14" x2="46.5" y2="17.5" />
    <line x1="6" y1="31" x2="10" y2="31" />
    <line x1="58" y1="31" x2="54" y2="31" />
    <line x1="14" y1="48" x2="17.5" y2="44.5" />
    <line x1="50" y1="48" x2="46.5" y2="44.5" />
  </g>

  <!-- Outer Bulb Aura -->
  <circle cx="32" cy="30" r="15" fill="#fef08a" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Bulb Glass Body -->
  <path d="M32 15 C23.5 15 17 21.5 17 30 C17 35.2 19.8 39.5 24 42 L24 47 C24 47.8 24.7 48.5 25.5 48.5 L38.5 48.5 C39.3 48.5 40 47.8 40 47 L40 42 C44.2 39.5 47 35.2 47 30 C47 21.5 40.5 15 32 15 Z"
        fill="url(#bulbGlow)"
        stroke="#b45309"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Internal Filament Highlight -->
  <path d="M28 27 L32 21 L36 27" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Metallic Screw Base -->
  <path d="M25 49 L39 49 L38 52 L26 52 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <path d="M26 53 L38 53 L37 55.5 L27 55.5 Z" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <path d="M28.5 56.5 L35.5 56.5 C35.5 58 34 59 32 59 C30 59 28.5 58 28.5 56.5 Z" fill="#475569"/>
</svg>
